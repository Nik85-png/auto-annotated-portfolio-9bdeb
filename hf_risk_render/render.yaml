services:
  - type: web
    name: hf-risk-live
    env: python
    rootDir: hf_risk_render
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PUBLIC_TOOL_URL
        value: https://hf-risk-live.onrender.com
      - key: PARENT_ORIGINS
        value: https://realnik.co.uk,https://www.realnik.co.uk,https://realnik.netlify.app,http://localhost:3000
